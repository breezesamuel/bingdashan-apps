<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>薪资锚点参考器</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.7;color:#222}
h1{font-size:1.5rem}.box{border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:16px 0}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem}
button{margin-top:12px;padding:10px 18px;background:#111;color:#fff;border:0;border-radius:8px;cursor:pointer;font-size:1rem}
.out{margin-top:14px;padding:12px;background:#f3f4f6;border-radius:8px;white-space:pre-wrap}
.k{font-size:.8rem;color:#666}.nav{font-size:.85rem;margin-bottom:20px}</style></head><body>
<div class="nav">◀ <a href="../index.html">← 回工具总表</a> · 人群: 小老板 · 痛点: 招人不知道给多少薪资合适</div>
<h1>薪资锚点参考器</h1><div class="box"><label>城市/成本(元)</label><input id="c" type="text" placeholder="一线/二线 或 进货价"><label>级别</label><select id="l"><option>初级</option><option>熟练</option><option>资深</option></select>
<button onclick="go()">开始</button>
<div class="out" id="o">在这里出结果</div>
</div><p class="k">只针对小老板人群的招人不知道给多少薪资合适场景, 免费工具 · bingdashan pain-tools</p>
<script>function go(){var city=document.getElementById("c").value;var base={一线:8,新一线:6,二线:5,三四线:4}[city]||5;var lv={初级:0.04,熟练:0.1,资深:0.16}[document.getElementById("l").value]||0.04;document.getElementById("o").textContent="建议("+city+"·"+document.getElementById("l").value+"):"+Math.round(base*10000*(1+lv)).toLocaleString()+"–"+Math.round(base*10000*(1+lv+0.03)).toLocaleString()+"元/月(含社保成本另+30%)。";}</script></body></html>
