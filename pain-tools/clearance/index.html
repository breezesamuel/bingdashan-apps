<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>清仓折扣底线计算器</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.7;color:#222}
h1{font-size:1.5rem}.box{border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:16px 0}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem}
button{margin-top:12px;padding:10px 18px;background:#111;color:#fff;border:0;border-radius:8px;cursor:pointer;font-size:1rem}
.out{margin-top:14px;padding:12px;background:#f3f4f6;border-radius:8px;white-space:pre-wrap}
.k{font-size:.8rem;color:#666}.nav{font-size:.85rem;margin-bottom:20px}</style></head><body>
<div class="nav">◀ <a href="../index.html">← 回工具总表</a> · 人群: 小老板 · 痛点: 库存压货想清掉不亏太多</div>
<h1>清仓折扣底线计算器</h1><div class="box"><label>简历内容</label><textarea id="r" rows="5" placeholder="简历正文"></textarea><label>现售价(元)</label><input id="v" type="number" placeholder="现价"><label>城市/成本(元)</label><input id="c" type="text" placeholder="一线/二线 或 进货价">
<button onclick="go()">开始</button>
<div class="out" id="o">在这里出结果</div>
</div><p class="k">只针对小老板人群的库存压货想清掉不亏太多场景, 免费工具 · bingdashan pain-tools</p>
<script>function go(){var cost=parseFloat(document.getElementById("c").value),cur=parseFloat(document.getElementById("v").value);if(!cost||!cur){document.getElementById("r").textContent="填进货价与现售价";return;}var loss=Math.round((1-cur/cost)*100);document.getElementById("r").textContent="进货"+cost+"元, 现售"+cur+"元 → 每件亏"+loss+"%。<br>清仓底线: ≥"+Math.round(cost*0.6)+"元(保本线提法) 可体面离场, 别再追涨本。";}</script></body></html>
