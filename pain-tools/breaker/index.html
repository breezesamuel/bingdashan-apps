<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>开店亏盈平衡点计算器</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.7;color:#222}
h1{font-size:1.5rem}.box{border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:16px 0}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem}
button{margin-top:12px;padding:10px 18px;background:#111;color:#fff;border:0;border-radius:8px;cursor:pointer;font-size:1rem}
.out{margin-top:14px;padding:12px;background:#f3f4f6;border-radius:8px;white-space:pre-wrap}
.k{font-size:.8rem;color:#666}.nav{font-size:.85rem;margin-bottom:20px}</style></head><body>
<div class="nav">◀ <a href="../index.html">← 回工具总表</a> · 人群: 小老板 · 痛点: 开店成本心里没数就投了</div>
<h1>开店亏盈平衡点计算器</h1><div class="box"><label>简历内容</label><textarea id="r" rows="5" placeholder="简历正文"></textarea><label>固定成本/月(元)</label><input id="f" type="number" placeholder="15000"><label>单价(元)</label><input id="p" type="number" placeholder="50">
<button onclick="go()">开始</button>
<div class="out" id="o">在这里出结果</div>
</div><p class="k">只针对小老板人群的开店成本心里没数就投了场景, 免费工具 · bingdashan pain-tools</p>
<script>function go(){var f=parseFloat(document.getElementById("f").value),v=parseFloat(document.getElementById("v").value),p=parseFloat(document.getElementById("p").value);if(!f||!v||!p||p<=v){document.getElementById("r").textContent="填固定成本/变动成本/单价(单价须大于变动成本)";return;}var n=Math.ceil(f/(p-v));var rev=n*p;document.getElementById("r").textContent="每月固定"+f+"元, 单价"+p+"元(变动"+v+") → 需卖 "+n+" 件回本, 营业额 "+rev.toFixed(2)+" 元。";}</script></body></html>
