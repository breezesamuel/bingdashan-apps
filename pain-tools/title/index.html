<h1>爆款标题三段检查器</h1><div class="box"><label>输入内容</label><textarea id="t" rows="4" placeholder="贴入你的原始内容/文字"></textarea><label>其他</label><input id="o" type="text" placeholder="可选">
<button onclick="go()">开始</button>
<div class="out" id="o">在这里出结果</div>
</div><p class="k">只针对UP主/博主人群的标题怎么取才不沉底场景, 免费工具 · bingdashan pain-tools</p>
<script>function go(){var t=document.getElementById("t").value;var ok=0,msgs=[];if(t.length>=8){ok++;msgs.push("长度✓(≥8字)");}else msgs.push("长度太短");if(/[0-9]|%|倍|招|个|天/.test(t)){ok++;msgs.push("数字钩子✓");}if(/最|免费|秘密|避坑|新手/.test(t)){ok++;msgs.push("价值词✓");}document.getElementById("o").innerHTML=msgs.join(" · ")+"<br>得分 "+ok+"/3 "+(ok>=2?"可发":"再压一版");}</script></body></html>
