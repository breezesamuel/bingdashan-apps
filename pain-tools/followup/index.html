<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>面试跟催时机计算器</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.7;color:#222}
h1{font-size:1.5rem}.box{border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:16px 0}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem}
button{margin-top:12px;padding:10px 18px;background:#111;color:#fff;border:0;border-radius:8px;cursor:pointer;font-size:1rem}
.out{margin-top:14px;padding:12px;background:#f3f4f6;border-radius:8px;white-space:pre-wrap}
.k{font-size:.8rem;color:#666}.nav{font-size:.85rem;margin-bottom:20px}</style></head><body>
<div class="nav">◀ <a href="../index.html">← 回工具总表</a> · 人群: 求职者 · 痛点: 面完不知道多久该跟催</div>
<h1>面试跟催时机计算器</h1><div class="box"><label>日期/天数</label><input id="d" type="text" placeholder="YYYY-MM-DD 或 天数"><label>数字参数</label><input id="n" type="number" placeholder="0"><label>其他</label><input id="o" type="text" placeholder="可选">
<button onclick="go()">开始</button>
<div class="out" id="o">在这里出结果</div>
</div><p class="k">只针对求职者人群的面完不知道多久该跟催场景, 免费工具 · bingdashan pain-tools</p>
<script>function go(){var d=new Date(document.getElementById("d").value);var days=parseInt(document.getElementById("n").value)||7;d.setDate(d.getDate()+days);var x=new Date(d);x.setDate(x.getDate()+3);document.getElementById("o").textContent="面试日: "+document.getElementById("d").value+"
建议首封信: "+d.toISOString().slice(0,10)+" (超过"+days+"天)
若石沉大海: "+x.toISOString().slice(0,10)+" 可提猎头/HR复核";}</script></body></html>
