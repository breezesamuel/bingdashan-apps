<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>剪辑素材缺口清单</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.7;color:#222}
h1{font-size:1.5rem}.box{border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:16px 0}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem}
button{margin-top:12px;padding:10px 18px;background:#111;color:#fff;border:0;border-radius:8px;cursor:pointer;font-size:1rem}
.out{margin-top:14px;padding:12px;background:#f3f4f6;border-radius:8px;white-space:pre-wrap}
.k{font-size:.8rem;color:#666}.nav{font-size:.85rem;margin-bottom:20px}</style></head><body>
<div class="nav">◀ <a href="../index.html">← 回工具总表</a> · 人群: UP主/博主 · 痛点: 剪到一半不知道素材缺哪段</div>
<h1>剪辑素材缺口清单</h1><div class="box"><label>输入内容</label><textarea id="t" rows="4" placeholder="贴入你的原始内容/文字"></textarea><label>其他</label><input id="o" type="text" placeholder="可选">
<button onclick="go()">开始</button>
<div class="out" id="o">在这里出结果</div>
</div><p class="k">只针对UP主/博主人群的剪到一半不知道素材缺哪段场景, 免费工具 · bingdashan pain-tools</p>
<script>function go(){var txt=document.getElementById("t").value.toLowerCase();var need=["开场白","空镜","BGM","字幕","封面","片尾","口播","演示"];var miss=need.filter(x=>!txt.includes(x));document.getElementById("o").innerHTML=miss.length?("⚠ 缺: "+miss.join("、")+"<br>哪些已经有: "+need.filter(x=>txt.includes(x)).join("、")):"全齐, 可以导出";}</script></body></html>
