<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>简历减肥器</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.7;color:#222}
h1{font-size:1.5rem}.box{border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:16px 0}

<h1>简历减肥器</h1><div class="box"><label>数值 1</label><input id="N1" type="number" placeholder="0"><label>数值 2</label><input id="N2" type="number" placeholder="0">
<button onclick="go()">开始</button><div class="out" id="o">结果在这里</div></div>
<p class="k">只服务「求职者」人群 · 免费 · bingdashan pain-tools</p>
<script>function go(){var t=parseInt(document.getElementById('N1').value)||40,c=parseInt(document.getElementById('N2').value)||5;var o='一页 A4 大概 '+(t*2)+' 行（含空行）。你现在每段经历删到 '+(c)+' 个要点以内：只留「结果数字」和「做了什么」，去掉形容词。删完大约省 '+(Math.max(1,(t/4)|0))+' 行。';document.getElementById('o').innerHTML=o;}</script></body></html>
