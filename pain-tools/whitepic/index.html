<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>白底图快速自检清单</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.7;color:#222}
h1{font-size:1.5rem}.box{border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:16px 0}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem}
button{margin-top:12px;padding:10px 18px;background:#111;color:#fff;border:0;border-radius:8px;cursor:pointer;font-size:1rem}
.out{margin-top:14px;padding:12px;background:#f3f4f6;border-radius:8px;white-space:pre-wrap}
.k{font-size:.8rem;color:#666}.nav{font-size:.85rem;margin-bottom:20px}</style></head><body>
<div class="nav">◀ <a href="../index.html">← 回工具总表</a> · 人群: 电商卖家 · 痛点: 上架图不会ps, 想改白底</div>
<h1>白底图快速自检清单</h1><div class="box"><label>输入内容</label><textarea id="t" rows="4" placeholder="贴入你的原始内容/文字"></textarea><label>其他</label><input id="o" type="text" placeholder="可选">
<button onclick="go()">开始</button>
<div class="out" id="o">在这里出结果</div>
</div><p class="k">只针对电商卖家人群的上架图不会ps, 想改白底场景, 免费工具 · bingdashan pain-tools</p>
<script>function go(){var txt=document.getElementById("t").value.toLowerCase();var need=["白底","无水印","产品≥60%","无杂背景","无文字","高清≥1000px"];var have=need.filter(x=>txt.includes(x));var miss=need.filter(x=>!txt.includes(x));document.getElementById("o").innerHTML="已完成:"+(have.join("、")||"无")+"<br>⚠ 还差: "+(miss.join("、")||"无")+"<br><br>自检法: 手机拍完放白纸上, 亮度调到产品不偏色即可上传。";}</script></body></html>
