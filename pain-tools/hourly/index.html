<h1>时薪保底线计算器</h1><div class="box"><label>简历内容</label><textarea id="r" rows="5" placeholder="简历正文"></textarea><label>日期/天数</label><input id="d" type="text" placeholder="YYYY-MM-DD 或 天数"><label>每月固定支出(元)</label><input id="m" type="number" placeholder="8000"><label>其他</label><input id="o" type="text" placeholder="可选">
<button onclick="go()">开始</button>
<div class="out" id="o">在这里出结果</div>

<script>function go(){var m=parseFloat(document.getElementById("m").value),d=parseFloat(document.getElementById("d").value),o=parseFloat(document.getElementById("o").value)||0;var need=m-month/m;var per=need/(d*6);document.getElementById("r").textContent="每月硬支出"+m+"元, 你每月约做"+d+"天(每天6有效小时) → 时薪底线 "+per.toFixed(2)+" 元/时。低于此价不建议接。";}</script></body></html>
